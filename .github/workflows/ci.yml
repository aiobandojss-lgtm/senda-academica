# CI/CD de Senda: cada push y cada pull request a main pasa por la calidad;
# solo un push a main (código ya revisado) aplica migraciones y despliega.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ningún paso necesita escribir en el repositorio
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (lint, tipos, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Las actions se fijan por commit (SHA) y no por etiqueta: una etiqueta se puede mover a código malicioso
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar dependencias exactas del package-lock.json
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos del Worker al día con wrangler.jsonc
        run: npm run cf-typegen -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas de la API (workerd, D1 y KV locales)
        run: npm test
      # Cada escenario de openspec/specs/ debe tener una prueba con su nombre: un escenario nuevo sin prueba no pasa
      - name: Trazabilidad entre las specs y las pruebas
        run: npm run trazabilidad
      - name: Build de producción
        run: npm run build

  # Corre en paralelo con "calidad": el flujo de la demo en un navegador real contra el build de producción
  # (vite preview), con D1 y KV locales y el seed ficticio. No toca nada en Cloudflare.
  e2e:
    name: Prueba E2E del flujo de la demo (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar dependencias exactas del package-lock.json
        run: npm ci
      - name: Instalar Chromium (solo el navegador sin interfaz) y sus dependencias del sistema
        run: npx playwright install --with-deps --only-shell chromium
      # El Worker local necesita JWT_SECRET. Es la misma clave pública de pruebas de vitest.config.ts: no es un
      # secreto. Se escribe en .dev.vars porque así la lee Wrangler en local, igual que en tu equipo.
      - name: Clave de sesión de pruebas para el Worker local
        run: echo "JWT_SECRET=clave-de-pruebas-publica-no-usar-en-ningun-otro-lado" > .dev.vars
      - name: Flujo de la demo de punta a punta
        run: npm run test:e2e
      # Si falla, el reporte trae capturas y la traza paso a paso (npx playwright show-trace)
      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7

  desplegar:
    name: Migraciones y despliegue
    # Solo se despliega si pasan las dos: calidad del código y el flujo de la demo
    needs: [calidad, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub registra cada despliegue con su URL en la pestaña "Environments"
    environment:
      name: demo
      url: https://senda.creativebycode.workers.dev
    # Dos pushes seguidos no despliegan a la vez: el segundo espera al primero
    concurrency:
      group: despliegue-demo
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar dependencias exactas del package-lock.json
        run: npm ci
      # Primero el esquema y después el código: el código nuevo nunca corre contra un esquema viejo.
      # Las migraciones deben ser aditivas para que el código anterior siga funcionando si el deploy falla.
      - name: Aplicar migraciones pendientes en la D1 remota
        run: npx wrangler d1 migrations apply DB --remote
      - name: Build y despliegue
        run: npm run deploy
      - name: Verificar que la URL pública responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://senda.creativebycode.workers.dev/api/salud
