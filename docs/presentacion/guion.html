<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senda – guion</title>
<link rel="icon" href="data:,">
<!--
  El guion de Aymer para su otra pantalla: el texto que se lee, las acciones de la demo, las notas de "cómo funciona"
  y los cronómetros. Se abre con doble clic, en el mismo navegador que diapositivas.html.
  Se sincroniza con diapositivas.html (lo que ve el jurado) por presentacion.js. Para cambiar una frase, edita TEXTOS.
-->
<link rel="stylesheet" href="comun.css">
<style>
  #guion { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
  .g-barra { display: grid; grid-template-columns: 1fr auto auto; gap: 28px; align-items: center; padding: 16px 28px; background: var(--selva); color: var(--crema); }
  .g-bloque { font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--barro); }
  .g-titulo { font-family: var(--titulo); font-weight: 600; font-size: 34px; line-height: 1.1; margin-top: 2px; }
  .g-relojes { display: flex; gap: 22px; }
  .reloj { min-width: 132px; }
  .reloj .r-nombre { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #CFE3D6; }
  .reloj .r-valor { font-family: var(--titulo); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .reloj .r-valor small { font-family: var(--texto); font-size: 17px; font-weight: 400; color: #CFE3D6; }
  .reloj .r-pista { height: 6px; border-radius: 999px; background: rgba(252, 249, 243, 0.2); margin-top: 6px; overflow: hidden; }
  .reloj .r-lleno { height: 100%; width: 0; background: var(--crema); border-radius: 999px; }
  .reloj.justo .r-lleno { background: #F4C27A; }
  .reloj.pasado .r-lleno { background: #FF9C85; }
  .reloj.pasado .r-valor { color: #FFC2B3; }
  .g-botones { display: flex; gap: 10px; }
  .g-botones button { font: 700 17px var(--texto); padding: 12px 18px; border-radius: 12px; border: 2px solid rgba(252, 249, 243, 0.45); background: transparent; color: var(--crema); cursor: pointer; }
  .g-botones button.principal { background: var(--crema); color: var(--selva); border-color: var(--crema); }
  .g-botones button:focus-visible { outline: 3px solid var(--terracota); outline-offset: 2px; }

  .g-pasos { display: flex; align-items: center; gap: 6px; padding: 12px 28px; border-bottom: 2px solid var(--linea); overflow-x: auto; }
  .g-pasos button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font: 600 14px var(--texto); color: var(--musgo); background: none; border: 0; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .g-pasos button::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--borde); }
  .g-pasos button.hecho::before { background: var(--selva); border-color: var(--selva); }
  .g-pasos button.actual { color: var(--tinta); background: var(--salvia); }
  .g-pasos button.actual::before { background: var(--terracota); border-color: var(--terracota); }
  .g-pasos .sep { width: 18px; border-top: 3px dotted var(--borde); flex: 0 0 auto; }

  .g-cuerpo { display: grid; grid-template-columns: 1fr 440px; min-height: 0; }
  .g-lectura { overflow-y: auto; padding: 30px 44px 60px; }
  .g-lectura .decir { font-size: 31px; line-height: 1.55; margin: 0 0 24px; max-width: 1150px; }
  .g-lectura .decir strong { color: var(--selva); }
  .g-lectura .hacer { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: baseline; margin: 0 0 24px; max-width: 1150px; background: var(--barro); border-left: 8px solid var(--terracota); border-radius: 12px; padding: 14px 20px; font-size: 23px; line-height: 1.45; color: var(--barro-texto); }
  .g-lectura .hacer::before { content: "HAZ"; font-size: 15px; font-weight: 800; letter-spacing: 0.16em; color: var(--terracota); }
  .g-lectura .hacer code, .entender code { font-size: 0.92em; background: rgba(255, 255, 255, 0.7); padding: 1px 7px; border-radius: 6px; }
  .g-lectura .hacer strong { color: var(--barro-texto); }
  .g-lateral { border-left: 2px solid var(--linea); padding: 22px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: #F7F2E8; }
  .g-etiqueta { font-size: 14px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--musgo); margin-bottom: 8px; }
  .mini { width: 392px; height: 220.5px; border-radius: 12px; overflow: hidden; border: 2px solid var(--linea); position: relative; background: var(--papel); }
  .mini iframe { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; border: 0; transform: scale(0.245); transform-origin: top left; pointer-events: none; }
  .g-siguiente { font-size: 20px; line-height: 1.35; }
  .g-siguiente span { color: var(--musgo); }
  .entender { background: var(--salvia); border-radius: 14px; padding: 16px 18px; font-size: 18px; line-height: 1.5; color: var(--tinta); }
  .g-ayuda { padding: 10px 28px; border-top: 2px solid var(--linea); font-size: 15px; color: var(--musgo); display: flex; gap: 22px; flex-wrap: wrap; }
  .g-ayuda kbd { font-family: var(--texto); font-weight: 700; background: #fff; border: 1px solid var(--borde); border-radius: 6px; padding: 1px 7px; color: var(--tinta); }
  .g-sincronia { margin-left: auto; }

  /* Pantalla de portátil (768 px de alto): más texto por pantalla, para no tener que desplazarse al leer */
  @media (max-height: 900px), (max-width: 1500px) {
    .g-barra { padding: 12px 24px; }
    .g-titulo { font-size: 28px; }
    .reloj .r-valor { font-size: 28px; }
    .g-pasos { padding: 8px 24px; }
    .g-cuerpo { grid-template-columns: 1fr 372px; }
    .g-lectura { padding: 16px 34px 10px; }
    .g-lectura .decir { font-size: 26px; line-height: 1.48; margin-bottom: 14px; }
    .g-lectura .hacer { font-size: 20px; padding: 8px 16px; margin-bottom: 14px; }
    .g-lateral { padding: 16px 18px; gap: 14px; }
    .mini { width: 336px; height: 189px; }
    .mini iframe { transform: scale(0.21); }
    .entender { font-size: 16px; }
    .g-ayuda { padding: 8px 24px; }
  }

  .g-alerta { background: #FFE5DF; color: #B63325; font-weight: 700; padding: 10px 28px; }
  #guion-completo { display: none; }

  /* ---------- Impresión: el guion completo en papel ---------- */
  @page { size: letter; margin: 16mm 15mm; }
  @media print {
    #guion { display: none; }
    #guion-completo { display: block; font-size: 12.5pt; line-height: 1.5; }
    #guion-completo h1 { font-family: var(--titulo); font-size: 22pt; margin: 0 0 4pt; }
    #guion-completo h2 { font-size: 15pt; margin: 18pt 0 6pt; color: var(--selva); }
    #guion-completo h3 { font-size: 12.5pt; margin: 12pt 0 4pt; break-after: avoid; }
    #guion-completo .decir { margin: 0 0 6pt; }
    #guion-completo .hacer { margin: 0 0 6pt; padding: 4pt 8pt; border-left: 3pt solid var(--terracota); background: var(--barro); color: var(--barro-texto); font-size: 11pt; }
    #guion-completo .entender { font-size: 10pt; margin: 4pt 0 0; padding: 6pt 8pt; }
    #guion-completo .paso { break-inside: avoid; }
  }
</style>
</head>
<body>

<div id="guion">
  <header class="g-barra">
    <div>
      <div class="g-bloque" id="g-bloque"></div>
      <div class="g-titulo" id="g-titulo"></div>
    </div>
    <div class="g-relojes">
      <div class="reloj" id="reloj-paso"><div class="r-nombre">Este paso</div><div class="r-valor"></div><div class="r-pista"><div class="r-lleno"></div></div></div>
      <div class="reloj" id="reloj-bloque"><div class="r-nombre">Bloque</div><div class="r-valor"></div><div class="r-pista"><div class="r-lleno"></div></div></div>
      <div class="reloj" id="reloj-total"><div class="r-nombre">Total</div><div class="r-valor"></div><div class="r-pista"><div class="r-lleno"></div></div></div>
    </div>
    <div class="g-botones">
      <button type="button" id="b-anterior" aria-label="Paso anterior">◀</button>
      <button type="button" id="b-reloj">Iniciar</button>
      <button type="button" id="b-siguiente" class="principal">Siguiente ▶</button>
    </div>
  </header>
  <nav class="g-pasos" id="g-pasos" aria-label="Pasos de la presentación"></nav>
  <main class="g-cuerpo">
    <article class="g-lectura" id="g-lectura" aria-live="polite"></article>
    <aside class="g-lateral">
      <div>
        <div class="g-etiqueta">En la pantalla que grabas</div>
        <div class="mini"><iframe src="diapositivas.html?miniatura" title="Lo que se graba" tabindex="-1" aria-hidden="true"></iframe></div>
      </div>
      <div>
        <div class="g-etiqueta">Sigue</div>
        <div class="g-siguiente" id="g-siguiente"></div>
      </div>
      <div>
        <div class="g-etiqueta">Cómo funciona (no se lee)</div>
        <div class="entender" id="g-entender"></div>
      </div>
    </aside>
  </main>
  <footer class="g-ayuda">
    <span><kbd>→</kbd> o <kbd>Espacio</kbd> siguiente</span>
    <span><kbd>←</kbd> anterior</span>
    <span><kbd>↑</kbd> <kbd>↓</kbd> mover el texto</span>
    <span><kbd>T</kbd> iniciar o pausar</span>
    <span><kbd>R</kbd> reiniciar el cronómetro</span>
    <span>Imprimir esta página (<kbd>Ctrl</kbd>+<kbd>P</kbd>) da el guion completo en papel</span>
    <span class="g-sincronia" id="g-sincronia"></span>
  </footer>
</div>

<div id="guion-completo"></div>

<script src="presentacion.js"></script>
<script>
"use strict";
// Todo dentro de un bloque: las constantes de esta página no se vuelven variables globales
{
const {
  BLOQUES, PASOS, $, estado, cargar, alCambiar, alRecibir, pedirEstado, teclaDeNavegacion,
  transcurridoPaso, total, enBloque, irA, siguiente, iniciarOPausar, reiniciar,
} = window.Senda;

// ---------- El texto de cada paso (unas 1.050 palabras para 10 minutos) ----------
// La llave es el id del paso en presentacion.js. "d" se dice en voz alta; "h" se hace y no se lee.
// "entender" es una nota para Aymer: cómo funciona por dentro, para entender y para las preguntas.
const TEXTOS = {
  portada: {
    guion: [
      { d: "Hola. Mi nombre es Aymer Ivan Obando Valois, soy ingeniero de sistemas en Cali. Por un tema de salud no pude presentar en vivo, así que preparé este video. Les presento **Senda**: una plataforma académica para una fundación educativa, con un asistente que **no inventa**." },
    ],
    entender: "«Senda» es el nombre del producto, independiente de la Fundación. La Fundación real es Funafrocol, pero la demo pública muestra «Fundación (demo)» hasta que autoricen por escrito: el nombre es una variable del Worker, no está escrito en el código.",
  },
  problema: {
    guion: [
      { d: "La Fundación está empezando, no tiene dinero y sus estudiantes estudian desde el celular. Hoy no sabe **quién entregó** un taller, **quién va al día** con los pagos ni **a quién suspender**." },
      { d: "Senda resuelve eso: entregas y notas, cuotas y pagos, y el bloqueo automático cuando una cuota pasa de 30 días vencida, en el plan gratuito de Cloudflare. Todo lo que van a ver sale de la base de datos real: los datos son ficticios porque la Fundación aún no entrega los suyos." },
    ],
    entender: "Criterio 2 de la rúbrica (datos reales): el frontend nunca tiene datos escritos; todo llega de la API, que lee D1, la base de datos SQLite de Cloudflare. Los datos ficticios se cargaron en esa base real con un script de seed.",
  },
  plataforma: {
    guion: [
      { d: "Les muestro el flujo completo en la plataforma publicada, no en una maqueta, con tres personas: Paola, estudiante; Liliana, docente; y la administración de la Fundación." },
      { h: "Cambia a la ventana de **Paola** (Edge, vista de celular), en la pantalla de ingreso." },
    ],
    entender: "Cada persona va en su propia ventana porque la sesión vive en una cookie del navegador: dos personas en la misma ventana se pisarían la sesión.",
  },
  entrega: {
    guion: [
      { d: "Primero, el diseño, que es propio: el símbolo es un sendero que sube paso a paso hasta la meta, los colores salen de la tierra y la selva, y la letra se diseñó para personas con baja visión, porque nuestros estudiantes leen desde el celular." },
      { h: "Ingresa con `9900001001` y `Demo2026*`." },
      { d: "Paola estudia Programación de Software y va al día. Así ve Senda en su celular: su estado de cuenta y su próxima entrega." },
      { h: "En Inicio, pulsa «Subir mi entrega» del Taller 3 de Lógica → elige `taller3-paola.pdf` del Escritorio → súbelo." },
      { d: "Sube su taller. El servidor revisa el archivo **por su contenido**, no por el nombre: un archivo de texto renombrado como PDF se rechaza." },
    ],

  },
  califica: {
    guion: [
      { h: "Cambia a la ventana de **Liliana** (ya con su sesión abierta) → Mis cursos → Lógica de programación → Taller 3." },
      { d: "Liliana, la docente, ve quién entregó y quién no, y puede descargar cada entrega. Fíjense que **no ve el celular ni el correo** de sus estudiantes: es la Ley de Habeas Data, y esa regla se aplica en el servidor, no solo en la pantalla." },
      { h: "«Calificar» en la fila de Paola → nota `4,2` y el comentario «Buen manejo de funciones» → «Guardar nota»." },
      { d: "Y califica: cuatro coma dos." },
    ],
    entender: "Los permisos se validan en la API: aunque alguien la llame directamente, a la docente no le llegan los datos de contacto (D18). Las notas van de 0,0 a 5,0 con un decimal, y una entrega calificada ya no se puede reemplazar: lo impide incluso un trigger de la base de datos.",
  },
  nota: {
    guion: [
      { h: "Vuelve a **Paola** → abre el Taller 3 de Lógica." },
      { d: "Y Paola ya ve su nota, **4,2 de 5,0**, con el comentario de la docente. Al instante." },
    ],
    entender: "No hay notificaciones ni procesos en segundo plano: la pantalla de Paola consulta la API y la nota ya está guardada en D1.",
  },
  asistente: {
    guion: [

  capas: {

    ],
    entender: "La similitud es el parecido entre el vector de la pregunta y el de cada fragmento (1 es idéntico). El umbral de 0,55 se midió antes: 0,743 con el fragmento correcto y 0,35 con un texto ajeno. La capa 3 está en api/src/rag/agente.ts y la prueba del «4.0», en api/test/agente.test.ts.",
  },
  medido: {

// Cada paso de presentacion.js debe tener su texto, y no debe sobrar ninguno
const faltan = PASOS.filter((p) => !TEXTOS[p.id]).map((p) => p.id);
const sobran = Object.keys(TEXTOS).filter((id) => !PASOS.some((p) => p.id === id));
if (faltan.length || sobran.length) {
  const alerta = document.createElement("div");
  alerta.className = "g-alerta";
  alerta.textContent = `El guion no coincide con los pasos: faltan [${faltan.join(", ")}], sobran [${sobran.join(", ")}].`;
  document.body.prepend(alerta);
  console.error(alerta.textContent);
}

// Texto seguro: escapa el HTML; lo que va entre comillas invertidas se muestra como código y **texto** en negrita
function formato(texto) {
  const escapar = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return texto
    .split(/(`[^`]*`)/)
    .map((parte) =>
      parte.startsWith("`") && parte.endsWith("`") && parte.length > 1
        ? `<code>${escapar(parte.slice(1, -1))}</code>`
        : escapar(parte).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"),
    )
    .join("");
}

const mmss = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const textoDe = (paso) => TEXTOS[paso.id] ?? { guion: [{ d: "(Este paso no tiene texto en TEXTOS.)" }], entender: "" };
const segmentos = (paso) => textoDe(paso).guion.map((g) => (g.d ? `<p class="decir">${formato(g.d)}</p>` : `<div class="hacer"><span>${formato(g.h)}</span></div>`)).join("");

// ---------- Pintar ----------
function pintarGuion() {
  const paso = PASOS[estado.paso];
  $("#g-bloque").textContent = `Bloque ${paso.bloque + 1} de ${BLOQUES.length} · ${BLOQUES[paso.bloque].nombre} · paso ${estado.paso + 1} de ${PASOS.length}`;
  $("#g-titulo").textContent = paso.titulo;
  $("#g-lectura").innerHTML = segmentos(paso);
  $("#g-lectura").scrollTop = 0;
  $("#g-entender").innerHTML = formato(textoDe(paso).entender);
  const prox = PASOS[estado.paso + 1];
  $("#g-siguiente").innerHTML = prox
    ? `<strong>${formato(prox.titulo)}</strong><br><span>${prox.diapositiva === paso.diapositiva ? "Misma diapositiva" : "Cambia la diapositiva"} · ${BLOQUES[prox.bloque].nombre}</span>`
    : "<strong>Fin.</strong><br><span>Detén la grabación.</span>";
  $("#b-anterior").disabled = estado.paso === 0;
  $("#b-siguiente").disabled = estado.paso === PASOS.length - 1;

  const nav = $("#g-pasos");
  nav.innerHTML = PASOS.map((p, i) => {
    const sep = i > 0 && PASOS[i - 1].bloque !== p.bloque ? '<span class="sep" aria-hidden="true"></span>' : "";
    const clase = i < estado.paso ? "hecho" : i === estado.paso ? "actual" : "";
    return `${sep}<button type="button" class="${clase}" data-i="${i}"${i === estado.paso ? ' aria-current="step"' : ""}>${i + 1}. ${formato(p.titulo)}</button>`;
  }).join("");
  nav.querySelector(".actual")?.scrollIntoView({ block: "nearest", inline: "center" });
  pintarRelojes();
}

function pintarReloj(id, ms, presupuestoMs) {
  const caja = document.getElementById(id);
  caja.querySelector(".r-valor").innerHTML = `${mmss(ms)} <small>/ ${mmss(presupuestoMs)}</small>`;
  const proporcion = presupuestoMs ? ms / presupuestoMs : 0;
  caja.querySelector(".r-lleno").style.width = `${Math.min(100, proporcion * 100)}%`;
  caja.classList.toggle("justo", proporcion >= 0.85 && proporcion <= 1);
  caja.classList.toggle("pasado", proporcion > 1);
}
function pintarRelojes() {
  const paso = PASOS[estado.paso];
  pintarReloj("reloj-paso", transcurridoPaso(estado.paso), paso.segundos * 1000);
  pintarReloj("reloj-bloque", enBloque(paso.bloque), BLOQUES[paso.bloque].segundos * 1000);
  pintarReloj("reloj-total", total(), BLOQUES.reduce((suma, b) => suma + b.segundos, 0) * 1000);
  $("#b-reloj").textContent = estado.corriendo ? "Pausar" : total() > 0 ? "Seguir" : "Iniciar";
}

alCambiar(pintarGuion);
alRecibir(() => { $("#g-sincronia").textContent = "Sincronizado con las diapositivas"; });

// Guion completo para imprimir (respaldo en papel)
function armarGuionCompleto() {
  const partes = ['<h1>Senda – guion de la presentación</h1><p>Lunes 23 de noviembre de 2026 · unos 10 minutos · lo que va en recuadro se hace, no se lee.</p>'];
  BLOQUES.forEach((b, ib) => {
    partes.push(`<h2>${ib + 1}. ${b.nombre} (${mmss(b.segundos * 1000)})</h2>`);
    PASOS.forEach((p) => {
      if (p.bloque !== ib) return;
      const texto = textoDe(p);
      partes.push(
        `<div class="paso"><h3>${formato(p.titulo)} · ${p.segundos} s</h3>${texto.guion
          .map((g) => (g.d ? `<p class="decir">${formato(g.d)}</p>` : `<p class="hacer">HAZ: ${formato(g.h)}</p>`))
          .join("")}<p class="entender">Cómo funciona: ${formato(texto.entender)}</p></div>`,
      );
    });
  });
  $("#guion-completo").innerHTML = partes.join("");
}

// ---------- Teclado y botones ----------
document.addEventListener("keydown", (e) => {
  if (teclaDeNavegacion(e)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    $("#g-lectura").scrollBy({ top: e.key === "ArrowDown" ? 140 : -140, behavior: "smooth" });
  } else if ((e.key === "r" || e.key === "R") && confirm("¿Reiniciar el cronómetro y volver a la portada?")) {
    reiniciar();
  }
});
$("#b-anterior").addEventListener("click", () => irA(estado.paso - 1));
$("#b-siguiente").addEventListener("click", siguiente);
$("#b-reloj").addEventListener("click", iniciarOPausar);
$("#g-pasos").addEventListener("click", (e) => {
  const boton = e.target.closest("button[data-i]");
  if (boton) irA(Number(boton.dataset.i));
});

// ---------- Arranque ----------
cargar();
armarGuionCompleto();
pintarGuion();
pedirEstado();
setInterval(pintarRelojes, 250);
}
